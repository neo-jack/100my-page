
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/public/icon.svg" />
    <!-- Title, description, canonical and structured data are emitted by build/seo.js. -->
    <link rel="preload" href="/public/textures/paper-texture.webp" as="image" fetchpriority="high" />
    <!-- Critical loading UI stays inline so it paints before the application downloads. -->
    <style>
      body { margin: 0; background: #f8f7f4; }
      #startup-loader { position: fixed; inset: 0; z-index: 1000; color: #141414; font-family: Arial, sans-serif; touch-action: none; --load-offset: 100%; }
      .startup-paper { position: absolute; inset: 0; background: #f8f7f4 url('/public/textures/paper-texture.webp') center / cover; }
      .startup-paper--left { clip-path: polygon(0 0, 50% 0, 51.7% 8.3%, 52% 16.7%, 50.8% 25%, 50.8% 33.3%, 51.8% 41.7%, 47.2% 50%, 48.7% 58.3%, 49.7% 66.7%, 48.8% 75%, 51.2% 83.3%, 49.2% 91.7%, 50% 100%, 0 100%); }
      .startup-paper--right { clip-path: polygon(100% 0, 100% 100%, 50% 100%, 49.2% 91.7%, 51.2% 83.3%, 48.8% 75%, 49.7% 66.7%, 48.7% 58.3%, 47.2% 50%, 51.8% 41.7%, 50.8% 33.3%, 50.8% 25%, 52% 16.7%, 51.7% 8.3%, 50% 0);
        /* Overlap the seam by a fraction of a pixel to prevent antialiasing gaps. */
        margin-left: -0.5px;
      }
      .startup-tear { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; clip-path: inset(0 0 var(--load-offset) 0); transition: clip-path .35s ease-out; }
      .startup-percentage { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; }
      .startup-ring { position: absolute; top: 50%; left: 50%; width: 120px; height: 120px; transform: translate(-50%, -50%); }
      /* Animate HTML layers instead of SVG geometry to allow compositor rotation. */
      .startup-ring-rotor { position: absolute; inset: 0; will-change: transform; animation: startup-spin 10.4s linear infinite; }
      .startup-paper .startup-ring { visibility: hidden; }
      #startup-loader[data-state="revealing"] .startup-paper .startup-ring { visibility: visible; }
      #startup-loader[data-state="revealing"] > .startup-ring { visibility: hidden; }
      #startup-loader > .startup-ring { contain: layout paint; isolation: isolate; }
      .startup-ring-rotor svg { display: block; width: 100%; height: 100%; }
      .startup-ring-rotor + .startup-ring-rotor { animation-direction: reverse; animation-duration: 4.2s; }
      .startup-message { position: absolute; top: calc(50% + 88px); left: 50%; transform: translateX(-50%); width: min(320px, 85vw); text-align: center; font: 14px/1.6 Arial, sans-serif; }
      #startup-loader[data-state='error'] .startup-ring-rotor { animation-play-state: paused; }
      @keyframes startup-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .startup-ring-rotor { animation: none; } .startup-tear { transition: none; } }
    </style>
    <script>
      // Vite replaces the entry script tag, so handle boot download failures here.
      window.addEventListener('error', function (event) {
        if (!(event.target instanceof HTMLScriptElement) || event.target.dataset.monitorSdk) return;
        function showError() {
          var loader = document.getElementById('startup-loader');
          if (loader) loader.dataset.state = 'error';
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', showError, { once: true });
        else showError();
      }, true);
    </script>
  </head>
  <body>
    <div id="startup-loader" data-state="loading">
      <div id="startup-progress" role="progressbar" aria-label="正在加载首页与 About 场景" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="startup-paper startup-paper--left" aria-hidden="true">
          <svg class="startup-tear" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M50 0 51.7 8.3 52 16.7 50.8 25 50.8 33.3 51.8 41.7 47.2 50 48.7 58.3 49.7 66.7 48.8 75 51.2 83.3 49.2 91.7 50 100" pathLength="100" fill="none" stroke="#333" stroke-width="1.5" vector-effect="non-scaling-stroke" /></svg>
          <div class="startup-ring"><div class="startup-ring-rotor"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44.6" fill="none" stroke="#333" stroke-width="1.45" stroke-dasharray="9.5 15.5" opacity=".79" /></svg></div><div class="startup-ring-rotor"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="34.8" fill="none" stroke="#333" stroke-width="1.05" stroke-dasharray="5.5 10.5" opacity=".51" /></svg></div></div>
          <span class="startup-percentage" data-loading-percent>0%</span>
        </div>
        <div class="startup-paper startup-paper--right" aria-hidden="true">
          <svg class="startup-tear" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M50 0 51.7 8.3 52 16.7 50.8 25 50.8 33.3 51.8 41.7 47.2 50 48.7 58.3 49.7 66.7 48.8 75 51.2 83.3 49.2 91.7 50 100" pathLength="100" fill="none" stroke="#333" stroke-width="1.5" vector-effect="non-scaling-stroke" /></svg>
          <div class="startup-ring"><div class="startup-ring-rotor"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44.6" fill="none" stroke="#333" stroke-width="1.45" stroke-dasharray="9.5 15.5" opacity=".79" /></svg></div><div class="startup-ring-rotor"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="34.8" fill="none" stroke="#333" stroke-width="1.05" stroke-dasharray="5.5 10.5" opacity=".51" /></svg></div></div>
          <span class="startup-percentage" data-loading-percent>0%</span>
        </div>
      </div>
      <div class="startup-ring" aria-hidden="true"><div class="startup-ring-rotor"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44.6" fill="none" stroke="#333" stroke-width="1.45" stroke-dasharray="9.5 15.5" opacity=".79" /></svg></div><div class="startup-ring-rotor"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="34.8" fill="none" stroke="#333" stroke-width="1.05" stroke-dasharray="5.5 10.5" opacity=".51" /></svg></div></div>
      <noscript><p class="startup-message">请启用 JavaScript 以浏览 3D 场景。</p></noscript>
    </div>
    <div id="root" inert aria-busy="true"></div>
    <script type="module">
      import { reportStartupError, startStartup } from '/src/utils/startup.ts';

      // Keep React, Three.js and application CSS out of the initial entry chunk.
      startStartup();
      import('/src/App.tsx').catch(reportStartupError);
    </script>
    <script>
      // Optional telemetry loads independently and never blocks the scene startup.
      if ('%VITE_MONITOR_SCRIPT%' && location.hostname === '%VITE_MONITOR_HOST%') {
        var monitorScript = document.createElement('script');
        monitorScript.dataset.monitorSdk = 'true';
        monitorScript.async = true;
        monitorScript.src = '%VITE_MONITOR_SCRIPT%';
        monitorScript.onload = function () {
          try {
            window.pageMonitor = window.PageMonitor.init({
              project: '%VITE_MONITOR_PROJECT%',
              environment: 'production',
              release: '%VITE_RELEASE%',
              endpoint: '%VITE_MONITOR_ENDPOINT%'
            });
          } catch (_) { /* Monitoring must not interrupt the application. */ }
        };
        document.head.appendChild(monitorScript);
      }
    </script>
  </body>
</html>
