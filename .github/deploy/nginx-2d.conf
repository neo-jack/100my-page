server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    error_page 404 = @missing;
    location @missing { add_header Cache-Control "no-store" always; return 404; }
    location = /2D { absolute_redirect off; return 301 /2D/; }
    location ~* (?:^|/)(?:\.[^/]+|src|public|node_modules|build|res|@vite|@fs|@id)(?:/|$) { return 404; }
    location ~* (?:^|/)(?:[^/]*[._-])?(?:licen[cs]es?|copying|notices?)(?:(?:[._-][^/]*)?\.(?:txt|md)|(?:[_-][^/.]*)?)$ { try_files $uri =404; }
    location ~* (?:\.(?:map|[cm]?tsx?|cjs|[cm]?jsx|vue|svelte|scss|sass|less|md)$|/(?:package(?:-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|(?:vite|tsconfig)(?:\.[^/]*)?\.[^/]+)$) { return 404; }
    location ~* ^/2D/assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2|ttf|otf|mp3|wav|ogg)$ { try_files $uri =404; expires 30d; add_header Cache-Control public; }
    location /2D/ { try_files $uri $uri/ /2D/index.html; add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location / { return 404; }
}
