limit_req_zone $binary_remote_addr zone=ai_chat:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=monitor_ingest:1m rate=2r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    error_page 404 = @missing_resource;
    location @missing_resource {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker DNS is resolved per request so an API restart cannot stop the site.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location = /3D/monitor {
        return 308 https://www.lanbinquan.top/3D/monitor/$is_args$args;
    }
    location ^~ /3D/monitor/ {
        # TLS terminates at the existing Caddy gateway, which sets this header.
        if ($http_x_forwarded_proto != https) {
            return 308 https://www.lanbinquan.top$request_uri;
        }
        # Only private Docker peers are trusted to forward the client address.
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 10.0.0.0/8;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;
        limit_req zone=monitor_ingest burst=30 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        client_body_timeout 15s;
        set $monitor_backend http://page-monitor:4318;
        proxy_pass $monitor_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_intercept_errors off;
        add_header Cache-Control no-store always;
    }
    # Browser runtimes require HTTPS; the independent playground manages TLS.
    location = /React {
        return 308 https://www.lanbinquan.top/React/;
    }
    location ^~ /React/ {
        return 308 https://www.lanbinquan.top$request_uri;
    }
    location = /codeground {
        return 308 https://www.lanbinquan.top/codeground/;
    }
    location ^~ /codeground/ {
        return 308 https://www.lanbinquan.top$request_uri;
    }
    location = /AItool {
        absolute_redirect off;
        return 301 /AItool/$is_args$args;
    }
    # Keep the prefix and bypass the generic static-file regex locations below.
    # Resolve at request time so AItool downtime cannot prevent homepage startup.
    location ^~ /AItool/ {
        set $aitool_backend http://ai-tool:80;
        proxy_pass $aitool_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_intercept_errors off;
    }
    location = /api/ai/chat {
        limit_req zone=ai_chat burst=3 nodelay;
        limit_req_status 429;
        error_page 429 = @ai_rate_limited;
        client_max_body_size 64k;
        client_body_timeout 15s;
        set $ai_backend http://ai-api:3001;
        proxy_pass $ai_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
        proxy_connect_timeout 3s;
    }
    location @ai_rate_limited {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header Retry-After 10 always;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"Please retry later."}}';
    }
    location = /api/ai/config {
        resolver 127.0.0.11 valid=5s;
        set $ai_config_upstream http://ai-api:3001;
        proxy_pass $ai_config_upstream;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location = /api/ai/health {
        set $ai_health http://ai-api:3001/health;
        proxy_pass $ai_health;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        add_header Cache-Control no-store always;
    }
    location /api/ { return 404; }

    location = /2D {
        return 301 /2D/;
    }
    # 2D releases are independent; preserve the full /2D/ path and query.
    location ^~ /2D/ {
        set $page_2d_backend http://page-2d:80;
        proxy_pass $page_2d_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_intercept_errors off;
    }

    # Internal workspace paths must not reach static serving or SPA fallback.
    location ~* (?:^|/)(?:\.[^/]+|src|public|node_modules|build|res|@vite|@fs|@id)(?:/|$) {
        return 404;
    }

    # Legal documents remain distributable, including Markdown notices.
    location ~* (?:^|/)(?:[^/]*[._-])?(?:licen[cs]es?|copying|notices?)(?:(?:[._-][^/]*)?\.(?:txt|md)|(?:[_-][^/.]*)?)$ {
        try_files $uri =404;
    }

    location ~* (?:\.(?:map|[cm]?tsx?|cjs|[cm]?jsx|vue|svelte|scss|sass|less|md)$|/(?:package(?:-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|(?:vite|tsconfig)(?:\.[^/]*)?\.[^/]+)$) {
        return 404;
    }

    # Retire the old 3D media URLs even if stale files are accidentally copied.
    # Keep this below legal notices; /2D/ has a separate resource namespace.
    location ~* ^/(?:(?:textures|sounds|fonts)(?:/|$)|(?:bgm\.mp3|icon\.svg|apple-icon\.png)$) {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location ~* ^/(?:2D/)?assets/ {
        try_files $uri =404;
        # Content hashes change with the bytes; browsers and CDNs can retain them.
        # Do not use 'always': missing resources must keep the no-store 404 policy.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header CDN-Cache-Control "public, max-age=31536000";
        add_header Cloudflare-CDN-Cache-Control "public, max-age=31536000";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2|ttf|otf|mp3|wav|ogg|glb|gltf|ktx2)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control public;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
