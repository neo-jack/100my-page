server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-store" always;
    location /api/ { return 404; }
    # Internal workspace paths must not reach static serving or SPA fallback.
    location ~* (?:^|/)(?:\.[^/]+|src|public|node_modules|build|res|@vite|@fs|@id)(?:/|$) {
        return 404;
    }

    # Legal documents remain distributable, including Markdown notices.
    location ~* (?:^|/)(?:[^/]*[._-])?(?:licen[cs]es?|copying|notices?)(?:(?:[._-][^/]*)?\.(?:txt|md)|(?:[_-][^/.]*)?)$ {
        try_files $uri =404;
    }

    location ~* (?:\.(?:map|[cm]?tsx?|cjs|[cm]?jsx|vue|svelte|scss|sass|less|md)$|/(?:package(?:-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|(?:vite|tsconfig)(?:\.[^/]*)?\.[^/]+)$) {
        return 404;
    }

    # Retire the old 3D media URLs even if stale files are accidentally copied.
    # Keep this below legal notices; /2D/ has a separate resource namespace.
    location ~* ^/(?:(?:textures|sounds|fonts)(?:/|$)|(?:bgm\.mp3|icon\.svg|apple-icon\.png)$) {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location ~* ^/(?:2D/)?assets/ {
        try_files $uri =404;
        # Content hashes change with the bytes; browsers and CDNs can retain them.
        # Do not use 'always': missing resources must keep the no-store 404 policy.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header CDN-Cache-Control "public, max-age=31536000";
        add_header Cloudflare-CDN-Cache-Control "public, max-age=31536000";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|webp|avif|ico|svg|woff|woff2|ttf|otf|mp3|wav|ogg|glb|gltf|ktx2)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control public;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
